<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpuls Tracker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #030308;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow-x: hidden;
        }

        /* Starry Background */
        .space-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #0b0f19 0%, #030308 100%);
            z-index: 1;
        }
        .stars {
            position: absolute;
            width: 100%; height: 100%;
            background-image: 
                radial-gradient(1px 1px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 40px 70px, rgba(255,255,255,0.8), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #ffffff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 150px 150px;
            opacity: 0.6;
        }
        .grid-overlay {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(255, 100, 100, 0.15) 1px, transparent 1px);
            background-size: 30px 30px;
            opacity: 0.4;
        }

        /* UI Layer */
        .ui-layer {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 20, 35, 0.6);
            backdrop-filter: blur(10px);
            padding: 10px 14px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .username {
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.5px;
            color: #e2e8f0;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .lp-badge {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .profile-btn {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: #0284c7;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            color: white;
        }

        /* Stats Panel */
        .stats-panel {
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #94a3b8;
        }
        .streak {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #cbd5e1;
        }
        .rank {
            color: #38bdf8;
            font-weight: 600;
        }
        .progress-bar-container {
            margin-top: 6px;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #0284c7, #38bdf8);
            box-shadow: 0 0 10px #38bdf8;
        }

        /* Center Black Hole Container */
        .center-stage {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin: 40px 0;
        }
        .black-hole {
            width: 220px; height: 220px;
            border-radius: 50%;
            background: #000;
            position: relative;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.2), inset 0 0 20px rgba(255, 255, 255, 0.4);
        }
        .accretion-disk {
            position: absolute;
            inset: -20px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, rgba(255,255,255,0.9), rgba(200,220,255,0.3), rgba(255,255,255,0.9));
            filter: blur(8px);
            animation: spinDisk 10s linear infinite;
            z-index: -1;
        }
        @keyframes spinDisk {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .ship {
            position: absolute;
            bottom: 25px; right: 25px;
            width: 24px; height: 24px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23fff"><path d="M12 2l2 7h7l-5.5 4 2 7L12 16l-5.5 4 2-7L3 9h7z"/></svg>') no-repeat center;
            background-size: contain;
            z-index: 6;
        }

        /* Bottom Nav */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background: rgba(10, 14, 26, 0.8);
            backdrop-filter: blur(12px);
            padding: 10px 0;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #64748b;
            text-decoration: none;
            font-size: 11px;
        }
        .nav-item.active {
            color: #38bdf8;
        }
        .nav-item svg {
            width: 20px; height: 20px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <!-- Starry background -->
    <div class="space-bg">
        <div class="stars"></div>
        <div class="grid-overlay"></div>
    </div>

    <!-- UI Layer -->
    <div class="ui-layer">
        <!-- Top info section -->
        <div>
            <div class="top-bar">
                <span class="username">JOKER_RONIN</span>
                <div class="header-right">
                    <div class="lp-badge">⚡ 15 000 LP</div>
                    <button class="profile-btn">
                        <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    </button>
                </div>
            </div>
            <div class="stats-panel">
                <div class="streak">
                    <span>🔥</span> Серия: <strong style="color: #fff;">4 дн.</strong>
                </div>
                <div class="rank">
                    🏆 Ранг: Завоеватель
                </div>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill"></div>
            </div>
        </div>

        <!-- Center Black Hole Stage -->
        <div class="center-stage">
            <div class="black-hole">
                <div class="accretion-disk"></div>
                <div class="ship"></div>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <a href="#" class="nav-item active">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                Главная
            </a>
            <a href="#" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.97-4-4L2 16.99z"/></svg>
                Сессии
            </a>
            <a href="#" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M19 6h-2c0-2.76-2.24-5-5-5S7 3.24 7 6H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-7-3c1.66 0 3 1.34 3 3H9c0-1.66 1.34-3 3-3zm7 17H5V8h14v12z"/></svg>
                Магазин
            </a>
            <a href="#" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                Лидеры
            </a>
        </div>
    </div>

</body>
</html>
