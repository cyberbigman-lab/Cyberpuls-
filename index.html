<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CyberPuls - Blitz Tracker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #020308;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: relative;
        }

        /* КОСМОС И ЗВЕЗДНОЕ НЕБО НА ФОНЕ */
        .space-background {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 40%, rgba(25, 12, 40, 0.85) 0%, rgba(2, 3, 8, 0.99) 85%);
            z-index: -3;
            overflow: hidden;
        }

        .stars-layer {
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background-image: 
                radial-gradient(1px 1px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 40px 70px, rgba(0, 242, 254, 0.9), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 130px 150px, rgba(255, 150, 100, 0.8), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 160px 110px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 200px 220px, #ffffff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 220px 220px;
            opacity: 0.6;
            animation: twinkleStars 120s linear infinite;
        }

        @keyframes twinkleStars {
            0% { transform: translateY(0); }
            100% { transform: translateY(50%); }
        }

        /* ИЛЛЮЗИЯ ЧЕРНОЙ ДЫРЫ И КОРАБЛЬ ЭНДЬЮРЕНС */
        .interstellar-universe {
            position: absolute;
            top: 48%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            height: 320px;
            z-index: -1;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bh-horizon {
            width: 110px;
            height: 110px;
            background: #000000;
            border-radius: 50%;
            box-shadow: 
                0 0 50px rgba(255, 110, 0, 0.6),
                0 0 100px rgba(255, 40, 0, 0.3),
                inset 0 0 25px rgba(255, 150, 50, 0.7);
            position: relative;
            z-index: 2;
        }

        .bh-disk {
            position: absolute;
            width: 300px;
            height: 90px;
            background: linear-gradient(90deg, 
                rgba(255, 50, 0, 0) 0%, 
                rgba(255, 120, 0, 0.8) 25%, 
                rgba(255, 255, 255, 0.95) 50%, 
                rgba(255, 120, 0, 0.8) 75%, 
                rgba(255, 50, 0, 0) 100%
            );
            border-radius: 50%;
            transform: rotate(-15deg) scaleY(0.38);
            filter: blur(4px);
            box-shadow: 0 0 50px rgba(255, 130, 0, 0.8);
            z-index: 1;
            animation: diskGlow 6s ease-in-out infinite;
        }

        .bh-lensing-top {
            position: absolute;
            width: 250px;
            height: 60px;
            border-top: 3px solid rgba(255, 210, 140, 0.85);
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
            top: 88px;
            filter: blur(2px);
            z-index: 3;
            box-shadow: 0 -15px 30px rgba(255, 130, 0, 0.7);
        }

        @keyframes diskGlow {
            0%, 100% { opacity: 0.75; transform: rotate(-15deg) scaleY(0.38) scale(1); }
            50% { opacity: 1; transform: rotate(-15deg) scaleY(0.4) scale(1.03); }
        }

        /* ОРБИТА КОРАБЛЯ ЭНДЬЮРЕНС */
        .spaceship-orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            z-index: 4;
            animation: orbitShip 22s linear infinite;
        }

        .spaceship {
            position: absolute;
            top: -135px;
            left: -20px;
            filter: drop-shadow(0 0 10px rgba(0, 242, 254, 0.9));
            animation: shipSpin 6s linear infinite;
        }

        @keyframes orbitShip {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes shipSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }

        .header {
            padding: 14px 20px 6px 20px;
            display: flex;
            justify-content: center;
            width: 100%;
            flex-shrink: 0;
            z-index: 2;
        }

        .user-card {
            background: transparent;
            border: none;
            border-radius: 0;
            padding: 4px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            box-shadow: none;
            backdrop-filter: none;
        }

        .username {
            font-weight: 800;
            font-size: 15px;
            letter-spacing: 1.2px;
            color: #f8fafc;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        }

        .balance-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.2) 0%, rgba(79, 70, 229, 0.2) 100%);
            border: 1px solid rgba(0, 242, 254, 0.5);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            color: #00f2fe;
            box-shadow: inset 0 1px 4px rgba(0, 242, 254, 0.4), 0 4px 10px rgba(0,0,0,0.4);
        }

        .profile-icon {
            width: 34px;
            height: 34px;
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.25), rgba(79, 70, 229, 0.35));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #00f2fe;
            border: 1px solid rgba(0, 242, 254, 0.5);
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.3);
        }

        .info-strip {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            padding: 0 24px;
            font-size: 12px;
            color: #94a3b8;
            flex-shrink: 0;
            z-index: 2;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .info-value {
            color: #fff;
            font-weight: 600;
        }

        .progress-bar-container {
            width: 100%;
            max-width: 400px;
            margin: 6px auto 0 auto;
            padding: 0 24px;
            flex-shrink: 0;
            z-index: 2;
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: rgba(10, 15, 30, 0.9);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.9);
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #00f2fe, #4f46e5);
            width: 5%;
            transition: width 0.5s ease;
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.9);
        }

        /* Контейнеры экранов */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: visible;
            width: 100%;
            z-index: 2;
        }

        .view-section {
            display: none;
            width: 100%;
            height: 100%;
            flex: 1;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .view-section.active {
            display: flex;
        }
